name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'worker/**'
      - 'package.json'
      - 'capacitor.config.*'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Configure installable release build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          s = s.replace("buildTypes {", "buildTypes {\n        release { signingConfig signingConfigs.debug }")
          p.write_text(s)
          PY
      - name: Build release APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.1.2 android/app/build/outputs/apk/release/app-release.apk --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: svensk-trafikkamera-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
